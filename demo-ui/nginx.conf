server {
  listen 80;
  server_name _;

  location = /health-ui {
    default_type text/plain;
    return 200 'ok';
  }

  location /expense/ {
    proxy_pass http://medical-expense-service:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /referral/ {
    proxy_pass http://medical-referral-service:3002/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    proxy_pass http://administration-service:3003/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
